              );
              let secrets: Vec<&str> = parts.password.as_deref().into_iter().collect();
              match run_shell(&command, &[]) {
                  Ok((success, stdout, stderr)) => {
                      let stdout = redact_secrets(&stdout, &secrets);
                      let stderr = redact_secrets(&stderr, &secrets);
                      if success {
                          CheckReport {
                              name: name.into(),
                              command: reported_command,
                              agreed: true,
                              output: String::new(),
                              error: None,
                          }
                      } else {
                          let tail: String = stdout
                              .lines()
                              .chain(stderr.lines())
                              .rev()
                              .take(15)
                              .collect::<Vec<_>>()
                              .into_iter()
                              .rev()
                              .collect::<Vec<_>>()
                              .join("\n");
                          CheckReport {
                              name: name.into(),
                              command: reported_command,
                              agreed: false,
                              output: tail,
                              error: None,
                          }
                      }
                  }
                  Err(error) => {
                      CheckReport::error(name, reported_command, format!("{error:#}"))
                  }
              }
          }

          // ---------------------------------------------------------------------------
          // orchestration''',
                  "run_flyway",
              )

              test_marker = '''    #[test]
              fn scheme_normalization() {
          '''
              tests = r'''    #[test]
              fn URL_parse_errors_do_not_echo_input_credentials() {
                  let error = parse_postgres_url("not-a-url-super-secret").unwrap_err().to_string();
                  assert!(!error.contains("super-secret"), "{error}");
