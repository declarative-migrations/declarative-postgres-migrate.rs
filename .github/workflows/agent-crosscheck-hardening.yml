              }

          '''
              if cross.count(test_marker) != 1:
                  raise SystemExit("crosscheck test marker changed")
              cross = cross.replace(test_marker, tests + test_marker, 1)

              stub_marker = '''        let r = run_migra(agree.to_str().unwrap(), "postgres://a@h/x", "postgres://a@h/y");
                  assert!(r.agreed, "{r:?}");
          '''
              stub_replacement = '''        let r = run_migra(
                      agree.to_str().unwrap(),
