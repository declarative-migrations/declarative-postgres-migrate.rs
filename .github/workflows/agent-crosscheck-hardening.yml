              };
              if let Err(error) =
                  std::fs::write(dir.path().join("V1__dpm_migration.sql"), migration_sql)
              {
                  return CheckReport::error(name, bin.into(), format!("{error:#}"));
              }
              let jdbc = format!(
                  "jdbc:postgresql://{}:{}/{}?sslmode={}",
