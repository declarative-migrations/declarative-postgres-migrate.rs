name: agent-crosscheck-hardening

on:
  push:
    branches:
      - agent/harden-apply-convergence-20260804

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Harden cross-check command handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          def replace_pattern(text: str, pattern: str, replacement: str, label: str) -> str:
              text, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.DOTALL)
              if count != 1:
                  raise SystemExit(f"{label}: pattern match count={count}")
              return text

          cross_path = Path("src/crosscheck.rs")
          cross = cross_path.read_text(encoding="utf-8")
          if "struct ScratchDir" not in cross:
              cross = replace_once(
                  cross,
                  '''fn shell_quote(s: &str) -> String {
              format!("'{}'", s.replace('\\'', "'\\\\''"))
          }
          ''',
                  '''pub(crate) fn shell_quote(s: &str) -> String {
              format!("'{}'", s.replace('\\'', "'\\\\''"))
          }

          fn redact_secrets(value: &str, secrets: &[&str]) -> String {
              let mut redacted = value.to_string();
              for secret in secrets.iter().copied().filter(|secret| !secret.is_empty()) {
                  redacted = redacted.replace(&shell_quote(secret), "'***'");
                  redacted = redacted.replace(secret, "***");
              }
              redacted
          }

          fn reported_url(url: &str) -> String {
              crate::introspect::redact_url(url)
          }
          ''',
                  "crosscheck shell helpers",
              )
              cross = replace_once(
                  cross,
                  '''    let output = cmd.output().with_context(|| format!("running: {command}"))?;
          ''',
                  '''    let output = cmd.output().context("running cross-check command")?;
          ''',
                  "crosscheck command error context",
              )
              cross = replace_once(
                  cross,
                  '''        .with_context(|| format!("not a URL: {url:?}"))?;
          ''',
                  '''        .context("not a PostgreSQL URL")?;
          ''',
                  "crosscheck URL error redaction",
              )
              cross = replace_pattern(
                  cross,
                  r'''static SCRATCH_COUNTER:.*?\n\}\n\n// ---------------------------------------------------------------------------\n// migra''',
                  '''static SCRATCH_COUNTER: std::sync::atomic::AtomicU64 =
              std::sync::atomic::AtomicU64::new(0);

          struct ScratchDir {
              path: std::path::PathBuf,
          }

          impl ScratchDir {
              fn create(label: &str) -> Result<Self> {
                  let parent = std::env::temp_dir();
                  for _ in 0..64 {
                      let counter = SCRATCH_COUNTER.fetch_add(1, std::sync::atomic::Ordering::Relaxed);
                      let nonce = std::time::SystemTime::now()
                          .duration_since(std::time::UNIX_EPOCH)
                          .map(|duration| duration.as_nanos())
                          .unwrap_or_default();
                      let path = parent.join(format!(
                          ".dpm-crosscheck-{label}-{:x}-{nonce:x}-{counter:x}",
                          std::process::id()
                      ));
                      let mut builder = std::fs::DirBuilder::new();
                      #[cfg(unix)]
                      {
                          use std::os::unix::fs::DirBuilderExt;
                          builder.mode(0o700);
                      }
                      match builder.create(&path) {
                          Ok(()) => return Ok(Self { path }),
                          Err(error) if error.kind() == std::io::ErrorKind::AlreadyExists => {
                              continue;
                          }
                          Err(error) => {
                              return Err(error).with_context(|| {
                                  format!("creating secure cross-check scratch directory {}", path.display())
                              });
                          }
                      }
                  }
                  anyhow::bail!("unable to allocate a unique cross-check scratch directory")
              }

              fn path(&self) -> &std::path::Path {
                  &self.path
              }
          }

          impl Drop for ScratchDir {
              fn drop(&mut self) {
                  let _ = std::fs::remove_dir_all(&self.path);
              }
          }

          // ---------------------------------------------------------------------------
          // migra''',
                  "secure scratch directory",
              )

              cross = replace_pattern(
                  cross,
                  r'''pub fn run_migra\(.*?\n\}\n\n// ---------------------------------------------------------------------------\n// pgdiff''',
                  '''pub fn run_migra(bin: &str, migrated_url: &str, source_url: &str) -> CheckReport {
              let name = "migra";
              if !binary_exists(bin) {
                  return CheckReport::missing(name, bin, "pip/pipx install migra");
              }
              let migrated = normalize_pg_scheme(migrated_url);
              let source = normalize_pg_scheme(source_url);
              let command = format!(
                  "{} --unsafe {} {}",
                  shell_quote(bin),
                  shell_quote(&migrated),
                  shell_quote(&source)
              );
              let reported_command = format!(
                  "{} --unsafe {} {}",
                  shell_quote(bin),
                  shell_quote(&reported_url(&migrated)),
                  shell_quote(&reported_url(&source))
              );
              let secrets = [migrated.as_str(), source.as_str()];
              match run_shell(&command, &[]) {
                  Ok((success, stdout, stderr)) => {
                      let out = redact_secrets(stdout.trim(), &secrets);
                      let error = redact_secrets(stderr.trim(), &secrets);
                      if out.is_empty() && success {
                          CheckReport {
                              name: name.into(),
                              command: reported_command,
                              agreed: true,
                              output: out,
                              error: None,
                          }
                      } else if !out.is_empty() {
                          CheckReport {
                              name: name.into(),
                              command: reported_command,
                              agreed: false,
                              output: out,
                              error: None,
                          }
                      } else {
                          CheckReport::error(
                              name,
                              reported_command,
                              format!("migra failed: {error}"),
                          )
                      }
                  }
                  Err(error) => CheckReport::error(name, reported_command, format!("{error:#}")),
              }
          }

          // ---------------------------------------------------------------------------
          // pgdiff''',
                  "run_migra",
              )

              cross = replace_pattern(
                  cross,
                  r'''pub fn run_atlas\(.*?\n\}\n\n// ---------------------------------------------------------------------------\n// stripe pg-schema-diff''',
                  '''pub fn run_atlas(bin: &str, migrated_url: &str, source_url: &str) -> CheckReport {
              let name = "atlas";
              if !binary_exists(bin) {
                  return CheckReport::missing(name, bin, "brew install ariga/tap/atlas");
              }
              let migrated = ensure_sslmode(migrated_url);
              let source = ensure_sslmode(source_url);
              let command = format!(
                  "{} schema diff --from {} --to {}",
                  shell_quote(bin),
                  shell_quote(&migrated),
                  shell_quote(&source)
              );
              let reported_command = format!(
                  "{} schema diff --from {} --to {}",
                  shell_quote(bin),
                  shell_quote(&reported_url(&migrated)),
                  shell_quote(&reported_url(&source))
              );
              let secrets = [migrated.as_str(), source.as_str()];
              match run_shell(&command, &[]) {
                  Ok((success, stdout, stderr)) => {
                      let out = redact_secrets(stdout.trim(), &secrets);
                      let error = redact_secrets(stderr.trim(), &secrets);
                      let lower = out.to_ascii_lowercase();
                      let synced = out.is_empty()
                          || lower.contains("schemas are synced")
                          || lower.contains("no changes to be made");
                      if success && synced {
                          CheckReport {
                              name: name.into(),
                              command: reported_command,
                              agreed: true,
                              output: String::new(),
                              error: None,
                          }
                      } else if success {
                          CheckReport {
                              name: name.into(),
                              command: reported_command,
                              agreed: false,
                              output: out,
                              error: None,
                          }
                      } else {
                          CheckReport::error(
                              name,
                              reported_command,
                              format!("atlas failed: {out} {error}"),
                          )
                      }
                  }
                  Err(error) => CheckReport::error(name, reported_command, format!("{error:#}")),
              }
          }

          // ---------------------------------------------------------------------------
          // stripe pg-schema-diff''',
                  "run_atlas",
              )

              cross = replace_pattern(
                  cross,
                  r'''pub fn run_pg_schema_diff\(.*?\n\}\n\n// ---------------------------------------------------------------------------\n// liquibase''',
                  '''pub fn run_pg_schema_diff(
              bin: &str,
              _pg_dump: &str,
              migrated_url: &str,
              source_url: &str,
          ) -> CheckReport {
              let name = "pg-schema-diff";
              if !binary_exists(bin) {
                  return CheckReport::missing(
                      name,
                      bin,
                      "go install github.com/stripe/pg-schema-diff/cmd/pg-schema-diff@latest",
                  );
              }
              let migrated = ensure_sslmode(migrated_url);
              let source = ensure_sslmode(source_url);
              let command = format!(
                  "{} plan --from-dsn {} --to-dsn {}",
                  shell_quote(bin),
                  shell_quote(&migrated),
                  shell_quote(&source)
              );
              let reported_command = format!(
                  "{} plan --from-dsn {} --to-dsn {}",
                  shell_quote(bin),
                  shell_quote(&reported_url(&migrated)),
                  shell_quote(&reported_url(&source))
              );
              let secrets = [migrated.as_str(), source.as_str()];
              match run_shell(&command, &[]) {
                  Ok((success, stdout, stderr)) => {
                      let out = redact_secrets(stdout.trim(), &secrets);
                      let error = redact_secrets(stderr.trim(), &secrets);
                      let lower = out.to_ascii_lowercase();
                      let empty_plan = out.is_empty()
                          || lower.contains("schema matches expected")
                          || lower.contains("no changes");
                      if success && empty_plan {
                          CheckReport {
                              name: name.into(),
                              command: reported_command,
                              agreed: true,
                              output: String::new(),
                              error: None,
                          }
                      } else if success {
                          CheckReport {
                              name: name.into(),
                              command: reported_command,
                              agreed: false,
                              output: out,
                              error: None,
                          }
                      } else {
                          CheckReport::error(
                              name,
                              reported_command,
                              format!("pg-schema-diff failed: {out} {error}"),
                          )
                      }
                  }
                  Err(error) => CheckReport::error(name, reported_command, format!("{error:#}")),
              }
          }

          // ---------------------------------------------------------------------------
          // liquibase''',
                  "run_pg_schema_diff",
              )

              cross = replace_pattern(
                  cross,
                  r'''pub fn run_liquibase\(.*?\n\}\n\n/// Parse `liquibase diff` output''',
                  '''pub fn run_liquibase(bin: &str, migrated_url: &str, source_url: &str) -> CheckReport {
              let name = "liquibase";
              if !binary_exists(bin) {
                  return CheckReport::missing(name, bin, "brew install liquibase");
              }
              let (a, b) = match (parse_postgres_url(migrated_url), parse_postgres_url(source_url)) {
                  (Ok(a), Ok(b)) => (a, b),
                  (Err(error), _) | (_, Err(error)) => {
                      return CheckReport::error(name, bin.into(), format!("{error:#}"));
                  }
              };
              let jdbc = |parts: &UrlParts| {
                  format!(
                      "jdbc:postgresql://{}:{}/{}?sslmode={}",
                      parts.host, parts.port, parts.dbname, parts.sslmode
                  )
              };
              let command = format!(
                  "{bin} --show-banner=false diff \
                   --url {url} --username {user} --password {password} \
                   --reference-url {reference_url} --reference-username {reference_user} \
                   --reference-password {reference_password}",
                  bin = shell_quote(bin),
                  url = shell_quote(&jdbc(&a)),
                  user = shell_quote(&a.user),
                  password = shell_quote(a.password.as_deref().unwrap_or("")),
                  reference_url = shell_quote(&jdbc(&b)),
                  reference_user = shell_quote(&b.user),
                  reference_password = shell_quote(b.password.as_deref().unwrap_or("")),
              );
              let reported_command = format!(
                  "{bin} --show-banner=false diff \
                   --url {url} --username {user} --password {password} \
                   --reference-url {reference_url} --reference-username {reference_user} \
                   --reference-password {reference_password}",
                  bin = shell_quote(bin),
                  url = shell_quote(&jdbc(&a)),
                  user = shell_quote(&a.user),
                  password = shell_quote(if a.password.is_some() { "***" } else { "" }),
                  reference_url = shell_quote(&jdbc(&b)),
                  reference_user = shell_quote(&b.user),
                  reference_password =
                      shell_quote(if b.password.is_some() { "***" } else { "" }),
              );
              let secrets: Vec<&str> = [a.password.as_deref(), b.password.as_deref()]
                  .into_iter()
                  .flatten()
                  .collect();
              match run_shell(&command, &[]) {
                  Ok((success, stdout, stderr)) => {
                      let stdout = redact_secrets(&stdout, &secrets);
                      let stderr = redact_secrets(&stderr, &secrets);
                      if !success {
                          return CheckReport::error(
                              name,
                              reported_command,
                              format!(
                                  "liquibase failed: {}",
                                  if stderr.trim().is_empty() { stdout } else { stderr }
                              ),
