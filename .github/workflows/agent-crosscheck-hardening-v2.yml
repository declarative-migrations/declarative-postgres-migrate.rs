name: agent-crosscheck-hardening-v2

on:
  push:
    branches:
      - agent/harden-apply-convergence-20260804

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Apply the reviewed patch against the actual signature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/agent-crosscheck-hardening.yml").read_text(
              encoding="utf-8"
          )
          start = workflow.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])

          old_signature = "async fn run_on_replica(\n"
          new_signature = (
              "async fn run_on_replica(p: &VerifyParams<'_>, migration_sql: &str, "
              "replica: &ShadowDb) -> Result<VerifyOutcome> {\n"
          )
          count = script.count(old_signature)
          if count != 2:
              raise SystemExit(
                  f"expected marker and replacement signature anchors, found {count}"
              )
          script = script.replace(old_signature, new_signature)
          exec(compile(script, "agent-crosscheck-hardening.py", "exec"), globals(), globals())

          cross_path = Path("src/crosscheck.rs")
          cross = cross_path.read_text(encoding="utf-8")
          cross = cross.replace(
              "fn URL_parse_errors_do_not_echo_input_credentials()",
              "fn url_parse_errors_do_not_echo_input_credentials()",
          )
          cross_path.write_text(cross, encoding="utf-8")

          verify_path = Path("src/verify.rs")
          verify = verify_path.read_text(encoding="utf-8")
          verify = verify.replace(
              'format!("{source}\\\\n{target}\\\\n")',
              'format!("{source}\\n{target}\\n")',
          )
          verify = verify.replace(
              '"source;printf PWN", "target"',
              '"source;printf PWN", "token=target"',
          )
          verify_path.write_text(verify, encoding="utf-8")
          PY

          rustfmt --edition 2021 src/crosscheck.rs src/verify.rs
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --lib
          cargo test --locked --test cli --no-run
          cargo test --locked --test cockroach --no-run
          git diff --check
      - name: Commit and push source-only hardening
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/crosscheck.rs src/verify.rs; then
            echo "No source change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/crosscheck.rs src/verify.rs
          git commit -m "Redact cross-check secrets and secure scratch files"
          git push origin HEAD:agent/harden-apply-convergence-20260804
