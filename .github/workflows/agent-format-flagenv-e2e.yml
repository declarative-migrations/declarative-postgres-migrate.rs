name: Format repository Rust baseline

on:
  pull_request:
    paths:
      - '**/*.rs'
      - 'rust-toolchain.toml'
      - '.github/workflows/agent-format-flagenv-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Checkout same-repository PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Install pinned Rustfmt
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply repository formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          if git diff --quiet -- '*.rs'; then
            echo 'Repository Rust sources are already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'style: apply pinned Rust 1.97.1 formatting baseline'
          git push origin "HEAD:${PR_BRANCH}"
