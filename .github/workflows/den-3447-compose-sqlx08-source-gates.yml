name: DEN-3447 compose SQLx 0.8 + source gates

on:
  push:
    branches:
      - fix/DEN-3447-sqlx08-source-gates-current-main

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Verify base and compose exact reviewed slices
        shell: bash
        run: |
          set -euo pipefail
          expected_base='839ea1cfcd1ba944786ca8ea3d8b7a31f09f81f7'
          sqlx_head='17d6905e7d735ebfaa3a54badd82b3f53b40fcd6'
          source_head='dd8875930d6e833b7e4ea531f9c29af5c53f9503'

          if ! git merge-base --is-ancestor "$expected_base" HEAD; then
            echo "branch does not descend from expected current main $expected_base" >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD^)" != "$expected_base" ]; then
            echo "unexpected pre-composition history; expected workflow commit directly on $expected_base" >&2
            git log --oneline -5 >&2
            exit 1
          fi

          git fetch --no-tags origin "$sqlx_head" "$source_head"
          git cat-file -e "$sqlx_head^{commit}"
          git cat-file -e "$source_head^{commit}"

          git checkout "$sqlx_head" -- Cargo.toml Cargo.lock
          git checkout "$source_head" -- src/crosscheck.rs tests/cockroach.rs tests/cockroach_quoted_enum.rs

          mapfile -t changed < <(git diff --name-only "$expected_base" -- \
            Cargo.toml Cargo.lock src/crosscheck.rs tests/cockroach.rs tests/cockroach_quoted_enum.rs | sort)
          expected=(Cargo.lock Cargo.toml src/crosscheck.rs tests/cockroach.rs tests/cockroach_quoted_enum.rs)
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            printf 'unexpected changed path set: %s\n' "${changed[*]}" >&2
            exit 1
          fi

          if git diff --name-only "$expected_base" | grep -vE '^(Cargo\.lock|Cargo\.toml|src/crosscheck\.rs|tests/cockroach\.rs|tests/cockroach_quoted_enum\.rs|\.github/workflows/den-3447-compose-sqlx08-source-gates\.yml)$'; then
            echo 'unexpected path outside composed slices' >&2
            exit 1
          fi

          git diff --check
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- Cargo.toml Cargo.lock src/crosscheck.rs tests/cockroach.rs tests/cockroach_quoted_enum.rs; then
            echo 'conflict marker detected' >&2
            exit 1
          fi
          grep -q '^sqlx = { version = "0\.8"' Cargo.toml
          grep -q 'the last sslmode parameter must win' src/crosscheck.rs
          grep -q 'command_env: None' tests/cockroach.rs
          grep -q 'command_env: None' tests/cockroach_quoted_enum.rs

      - name: Commit semantic composition and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ORESoftware automation'
          git config user.email 'noreply@users.noreply.github.com'
          git add -- Cargo.toml Cargo.lock src/crosscheck.rs tests/cockroach.rs tests/cockroach_quoted_enum.rs
          git rm -- .github/workflows/den-3447-compose-sqlx08-source-gates.yml
          git diff --cached --check
          git commit -m 'fix(DEN-3447): combine SQLx 0.8 with source gates'
          git push origin HEAD:refs/heads/fix/DEN-3447-sqlx08-source-gates-current-main
