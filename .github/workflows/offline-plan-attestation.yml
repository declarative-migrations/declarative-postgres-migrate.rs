name: Offline migration plan attestation v1
on:
  pull_request:
    paths:
      - 'scripts/offline_plan_attestation.py'
      - 'tests/test_offline_plan_attestation.py'
      - '.github/workflows/offline-plan-attestation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_offline_plan_attestation.py' -v
