name: Apply command environment fix

on:
  pull_request:
    paths:
      - 'src/main.rs'
      - 'tests/flagenv_cli_e2e.rs'
      - '.github/workflows/agent-apply-command-env-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Checkout same-repository PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Publish canonical command identity to child processes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main.rs')
          text = path.read_text()
          old = '''    if config.commands.contains_key(&command) {
              if let Some(key) = config.command_env_key() {
                  overrides.insert(key.to_string(), command.clone());
              }
              if let Some(marker) = config.command_marker_env(&command) {
                  overrides.insert(marker.to_string(), "true".to_string());
              }
          }
          '''
          new = '''    if config.commands.contains_key(&command) {
              if let Some(key) = config.command_env_key() {
                  overrides.insert(key.to_string(), command.clone());
                  std::env::set_var(key, &command);
              }
              // A parent shell may contain markers from an earlier invocation.
              // Clear every declared marker before publishing the selected one,
              // so spawned reviewers and cross-checkers see one canonical path.
              for spec in config.commands.values() {
                  if let Some(marker) = spec.env.as_deref() {
                      std::env::remove_var(marker);
                  }
              }
              if let Some(marker) = config.command_marker_env(&command) {
                  overrides.insert(marker.to_string(), "true".to_string());
                  std::env::set_var(marker, "true");
              }
          }
          '''
          if old not in text:
              raise SystemExit('expected command-publication block was not found exactly')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git diff --check

          if git diff --quiet -- src/main.rs tests/flagenv_cli_e2e.rs; then
            echo 'Command environment implementation is already synchronized.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs tests/flagenv_cli_e2e.rs
          git commit -m 'Publish command environment to child processes'
          git push origin "HEAD:${PR_BRANCH}"
