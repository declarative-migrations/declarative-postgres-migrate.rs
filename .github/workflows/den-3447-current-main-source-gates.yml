name: DEN-3447 current-main source-gate repair

on:
  push:
    branches:
      - fix/DEN-3447-current-main-source-gates

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Apply exact semantic repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cross = Path("src/crosscheck.rs")
          text = cross.read_text()
          old = "\n".join([
              "    let sslmode = query",
              "        .into_iter()",
              "        .flat_map(|q| q.split('&'))",
              "        .filter_map(|pair| pair.split_once('='))",
              "        .filter_map(|(k, v)| (k == \"sslmode\").then(|| v.to_string()))",
              "        .last()",
              "        .unwrap_or_else(|| \"disable\".to_string());",
          ])
          new = "\n".join([
              "    let sslmode = query",
              "        .into_iter()",
              "        .flat_map(|q| q.split('&'))",
              "        .filter_map(|pair| pair.split_once('='))",
              "        .filter(|(key, _)| *key == \"sslmode\")",
              "        .map(|(_, value)| value.to_string())",
              "        .next_back()",
              "        .unwrap_or_else(|| \"disable\".to_string());",
          ])
          if text.count(old) != 1:
              raise SystemExit(f"expected one sslmode parser block, found {text.count(old)}")
          text = text.replace(old, new, 1)

          marker = "\n".join([
              "        assert_eq!(p.sslmode, \"require\");",
              "",
              "        let p = parse_postgres_url(\"postgres://postgres@127.0.0.1:54329/postgres\").unwrap();",
          ])
          replacement = "\n".join([
              "        assert_eq!(p.sslmode, \"require\");",
              "",
              "        let p = parse_postgres_url(",
              "            \"postgres://u@h/db?sslmode=prefer&application_name=dpm&sslmode=require\",",
              "        )",
              "        .unwrap();",
              "        assert_eq!(p.sslmode, \"require\", \"the last sslmode parameter must win\");",
              "",
              "        let p = parse_postgres_url(\"postgres://postgres@127.0.0.1:54329/postgres\").unwrap();",
          ])
          if text.count(marker) != 1:
              raise SystemExit(f"expected one URL parser test marker, found {text.count(marker)}")
          cross.write_text(text.replace(marker, replacement, 1))

          cockroach = Path("tests/cockroach.rs")
          text = cockroach.read_text()
          needle = "\n".join([
              "        verbose: false,",
              "        introspect: &opts,",
              "    })",
              "    .await",
              "    .expect(\"CockroachDB verify must materialize a non-public enum column\");",
          ])
          replacement = "\n".join([
              "        verbose: false,",
              "        introspect: &opts,",
              "        command_env: None,",
              "    })",
              "    .await",
              "    .expect(\"CockroachDB verify must materialize a non-public enum column\");",
          ])
          if text.count(needle) != 1:
              raise SystemExit(f"expected one Cockroach enum verify tail, found {text.count(needle)}")
          cockroach.write_text(text.replace(needle, replacement, 1))

          quoted = Path("tests/cockroach_quoted_enum.rs")
          text = quoted.read_text()
          needle = "\n".join([
              "        verbose: false,",
              "        introspect: &options,",
              "    })",
              "    .await",
              "    .expect(\"quoted CockroachDB enum migration must materialize\");",
          ])
          replacement = "\n".join([
              "        verbose: false,",
              "        introspect: &options,",
              "        command_env: None,",
              "    })",
              "    .await",
              "    .expect(\"quoted CockroachDB enum migration must materialize\");",
          ])
          if text.count(needle) != 1:
              raise SystemExit(f"expected one quoted-enum verify tail, found {text.count(needle)}")
          quoted.write_text(text.replace(needle, replacement, 1))
          PY

          git diff --check
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- src/crosscheck.rs tests/cockroach.rs tests/cockroach_quoted_enum.rs; then
            echo 'conflict marker detected' >&2
            exit 1
          fi

      - name: Commit scoped repair and remove temporary applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ORESoftware automation'
          git config user.email 'noreply@users.noreply.github.com'
          git add -- src/crosscheck.rs tests/cockroach.rs tests/cockroach_quoted_enum.rs
          git rm -- .github/workflows/den-3447-current-main-source-gates.yml
          git diff --cached --check
          git commit -m 'fix(DEN-3447): repair current-main source gates'
          git push origin HEAD:refs/heads/fix/DEN-3447-current-main-source-gates
