name: agent-crosscheck-hardening-v3

on:
  push:
    branches:
      - agent/harden-apply-convergence-20260804

permissions:
  contents: write

concurrency:
  group: agent-crosscheck-hardening-v3
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Harden cross-check command handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path(".github/workflows/agent-crosscheck-hardening.yml").read_text(
              encoding="utf-8"
          )
          start = workflow.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          original_script = textwrap.dedent(workflow[start:end])

          # The original reviewed script's crosscheck.rs transformations are
          # independent of verify.rs and already reached the verify edit in the
          # first run. Execute that portion unchanged.
          cross_only = original_script[: original_script.index('verify_path = Path("src/verify.rs")')]
          exec(compile(cross_only, "agent-crosscheck-hardening-crosscheck.py", "exec"), globals(), globals())

          cross_path = Path("src/crosscheck.rs")
          cross = cross_path.read_text(encoding="utf-8")
          cross = cross.replace(
              "fn URL_parse_errors_do_not_echo_input_credentials()",
              "fn url_parse_errors_do_not_echo_input_credentials()",
          )
          cross_path.write_text(cross, encoding="utf-8")

          verify_path = Path("src/verify.rs")
          verify = verify_path.read_text(encoding="utf-8")
          if "external_check_commands" not in verify:
              signature = (
                  "async fn run_on_replica(p: &VerifyParams<'_>, migration_sql: &str, "
                  "replica: &ShadowDb) -> Result<VerifyOutcome> {\n"
              )
              helpers = '''fn render_external_template(template: &str, source: &str, target: &str) -> String {
              let mut rendered = String::with_capacity(template.len() + source.len() + target.len());
              let mut offset = 0usize;
              while offset < template.len() {
                  let remainder = &template[offset..];
                  let source_at = remainder.find("{source}").map(|index| offset + index);
                  let target_at = remainder.find("{target}").map(|index| offset + index);
                  let next = match (source_at, target_at) {
                      (Some(source_index), Some(target_index)) => {
                          if source_index <= target_index {
                              (source_index, "{source}".len(), source)
                          } else {
                              (target_index, "{target}".len(), target)
                          }
                      }
                      (Some(source_index), None) => (source_index, "{source}".len(), source),
                      (None, Some(target_index)) => (target_index, "{target}".len(), target),
                      (None, None) => {
                          rendered.push_str(remainder);
                          break;
                      }
                  };
                  rendered.push_str(&template[offset..next.0]);
                  rendered.push_str(next.2);
                  offset = next.0 + next.1;
              }
              rendered
          }

          fn external_check_commands(
              template: &str,
              source_url: &str,
              target_url: &str,
          ) -> (String, String) {
              let command = render_external_template(
                  template,
                  &crosscheck::shell_quote(source_url),
                  &crosscheck::shell_quote(target_url),
              );
              let reported = render_external_template(
                  template,
                  &crosscheck::shell_quote(&introspect::redact_url(source_url)),
                  &crosscheck::shell_quote(&introspect::redact_url(target_url)),
              );
              (command, reported)
          }

          fn redact_external_output(value: &str, source_url: &str, target_url: &str) -> String {
              value
                  .replace(source_url, &introspect::redact_url(source_url))
                  .replace(target_url, &introspect::redact_url(target_url))
          }

          '''
              if verify.count(signature) != 1:
                  raise SystemExit(
                      f"src/verify.rs: run_on_replica signature count={verify.count(signature)}"
                  )
              verify = verify.replace(signature, helpers + signature, 1)

              block_pattern = re.compile(
                  r'''            if let Some\(template\) = p\.external_check \{\n'''
                  r'''.*?'''
                  r'''            \}\n'''
                  r'''        \}\n\n'''
                  r'''        if let Some\(db\) = source_replica \{''',
                  re.DOTALL,
              )
              block_replacement = '''            if let Some(template) = p.external_check {
                  let (command, reported_command) =
                      external_check_commands(template, source_url, &replica.url);
                  let output = std::process::Command::new("sh")
                      .arg("-c")
                      .arg(&command)
                      .output()
                      .with_context(|| format!("running external check: {reported_command}"))?;
                  let stdout = redact_external_output(
                      String::from_utf8_lossy(&output.stdout).trim(),
                      source_url,
                      &replica.url,
                  );
                  let stderr = redact_external_output(
                      String::from_utf8_lossy(&output.stderr).trim(),
                      source_url,
                      &replica.url,
                  );
                  checks.push(CheckReport {
                      name: "external".into(),
                      command: reported_command,
                      agreed: output.status.success() && stdout.is_empty(),
                      output: stdout,
                      error: if output.status.success() {
                          None
                      } else {
                          Some(format!(
                              "external check exited {}{}",
                              output.status,
                              if stderr.is_empty() {
                                  String::new()
                              } else {
                                  format!(": {stderr}")
                              }
                          ))
                      },
                  });
              }
          }

          if let Some(db) = source_replica {'''
              verify, count = block_pattern.subn(
                  lambda _: block_replacement, verify, count=1
              )
              if count != 1:
                  raise SystemExit(f"src/verify.rs: external block match count={count}")

              verify += r'''

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn external_check_placeholders_are_shell_quoted_and_reported_without_secrets() {
                  let source = "postgres://alice:s'ecret@db/source?token=source;printf PWN";
                  let target = "postgres://bob:target-secret@db/target?token=target";
                  let (command, reported) = external_check_commands(
                      "printf '%s\\n' {source} {target}",
                      source,
                      target,
                  );
                  let output = std::process::Command::new("sh")
                      .arg("-c")
                      .arg(&command)
                      .output()
                      .unwrap();
                  assert!(output.status.success());
                  assert_eq!(
                      String::from_utf8(output.stdout).unwrap(),
                      format!("{source}\n{target}\n")
                  );
                  for secret in ["s'ecret", "target-secret", "source;printf PWN", "token=target"] {
                      assert!(!reported.contains(secret), "leaked {secret}: {reported}");
                  }
              }
          }
          '''
              verify_path.write_text(verify, encoding="utf-8")
          PY

          rustfmt --edition 2021 src/crosscheck.rs src/verify.rs
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --lib
          cargo test --locked --test cli --no-run
          cargo test --locked --test cockroach --no-run
          git diff --check
      - name: Commit and push source-only hardening
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/crosscheck.rs src/verify.rs; then
            echo "No source change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/crosscheck.rs src/verify.rs
          git commit -m "Redact cross-check secrets and secure scratch files"
          git push origin HEAD:agent/harden-apply-convergence-20260804
