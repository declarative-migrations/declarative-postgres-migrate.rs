name: dpm-server

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/interfaces.rs"
      - "src/server/**"
      - "src/sync.rs"
      - "src/bin/dpm-server.rs"
      - "openapi/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/interfaces.rs"
      - "src/server/**"
      - "src/sync.rs"
      - "src/bin/dpm-server.rs"
      - "openapi/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Unit and contract tests
        run: cargo test --locked --all-targets
      - name: Strict lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build server
        run: cargo build --locked --bin dpm-server
      - name: Validate OpenAPI JSON
        run: python -m json.tool openapi/dpm-server-v1.json >/dev/null
      - name: Real-process HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail
          port="$(python - <<'PY'
          import socket
          with socket.socket() as listener:
              listener.bind(("127.0.0.1", 0))
              print(listener.getsockname()[1])
          PY
          )"
          token='server-smoke-token-0123456789'
          export DPM_SERVER_BIND="127.0.0.1:${port}"
          export DPM_SERVER_TOKEN="${token}"
          export DPM_SERVER_DATABASES_JSON='{"primary":"postgres://127.0.0.1:9/unused"}'
          export DPM_SERVER_ALLOW_APPLY=false
          target/debug/dpm-server >server.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true; wait "${server_pid}" 2>/dev/null || true' EXIT

          for _ in {1..50}; do
            if curl --silent --fail "http://127.0.0.1:${port}/healthz" >health.json; then
              break
            fi
            sleep 0.1
          done
          python - <<'PY'
          import json
          with open("health.json", encoding="utf-8") as stream:
              payload = json.load(stream)
          assert payload["status"] == "ok"
          assert payload["service"] == "dpm-server"
          assert payload["api_version"] == "v1"
          PY

          curl --silent --fail "http://127.0.0.1:${port}/openapi.json" >served-openapi.json
          cmp openapi/dpm-server-v1.json served-openapi.json

          cat >diff.json <<'JSON'
          {
            "source": {
              "kind": "catalog",
              "catalog": {
                "format_version": 1,
                "server_version_num": 0,
                "database_flavor": "postgres",
                "schemas": [],
                "extensions": [],
                "enums": {},
                "sequences": {},
                "tables": {},
                "views": {},
                "functions": {},
                "triggers": {}
              }
            },
            "target": {
              "kind": "catalog",
              "catalog": {
                "format_version": 1,
                "server_version_num": 0,
                "database_flavor": "postgres",
                "schemas": [],
                "extensions": [],
                "enums": {},
                "sequences": {},
                "tables": {},
                "views": {},
                "functions": {},
                "triggers": {}
              }
            }
          }
          JSON

          unauthenticated_status="$(curl --silent --output unauthenticated.json \
            --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data @diff.json \
            "http://127.0.0.1:${port}/v1/diff")"
          test "${unauthenticated_status}" = 401

          curl --silent --fail \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            --data @diff.json \
            "http://127.0.0.1:${port}/v1/diff" >diff-response.json
          python - <<'PY'
          import json
          with open("diff-response.json", encoding="utf-8") as stream:
              payload = json.load(stream)
          assert payload["api_version"] == "v1"
          assert payload["summary"]["change_count"] == 0
          assert payload["plan"]["changes"] == []
          PY

          apply_status="$(curl --silent --output apply-disabled.json \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            --data '{"source":{"kind":"catalog","catalog":{"format_version":1,"server_version_num":0,"database_flavor":"postgres","schemas":[],"extensions":[],"enums":{},"sequences":{},"tables":{},"views":{},"functions":{},"triggers":{}}},"target":"primary","dry_run":false,"confirmation":"apply:primary"}' \
            "http://127.0.0.1:${port}/v1/apply")"
          test "${apply_status}" = 503
          grep -q 'apply_disabled' apply-disabled.json
      - name: Server log on failure
        if: failure()
        run: cat server.log 2>/dev/null || true
