name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly full cross-checker matrix

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: formatting (changed Rust files)
        shell: bash
        env:
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            base="$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")"
          elif [[ -n "${PUSH_BASE:-}" && ! "${PUSH_BASE}" =~ ^0+$ ]] \
            && git cat-file -e "${PUSH_BASE}^{commit}" 2>/dev/null; then
            base="${PUSH_BASE}"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base="HEAD^"
          else
            echo "No base commit is available; skipping the changed-file format check."
            exit 0
          fi

          mapfile -d '' rust_files < <(
            git diff --name-only --diff-filter=ACMRT -z "$base" HEAD -- '*.rs'
          )
          if ((${#rust_files[@]} == 0)); then
            echo "No changed Rust files."
            exit 0
          fi
          printf 'Checking %s\n' "${rust_files[@]}"
          rustfmt --edition 2021 --check "${rust_files[@]}"
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: unit tests
        run: cargo test --locked --lib
      - name: splitter property tests
        run: cargo test --locked --test fuzz_splitter

  package-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Package crate and install CLI in isolation
        run: bash scripts/check-release-contract.sh

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: "postgres:${{ matrix.postgres }}"
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: PostgreSQL convergence tests
        env:
          DPM_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
        run: cargo test --locked --test convergence -- --test-threads=4

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: CLI contracts and PostgreSQL lifecycle
        env:
          DPM_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
        run: cargo test --locked --test cli -- --test-threads=1

  cockroach:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Start CockroachDB v25.2.4
        run: >-
          docker run --detach --name dpm-cockroach
          --publish 26257:26257 --publish 8080:8080
          cockroachdb/cockroach:v25.2.4 start-single-node --insecure
      - name: Wait for CockroachDB
        run: |
          for _ in {1..60}; do
            if docker exec dpm-cockroach cockroach sql \
              --insecure --host=localhost:26257 --execute='SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs dpm-cockroach
          exit 1
      - name: CockroachDB convergence and CLI tests
        env:
          DPM_TEST_COCKROACH_DATABASE_URL: postgresql://root@localhost:26257/defaultdb?sslmode=disable
        run: cargo test --locked --test cockroach -- --test-threads=1
      - name: CockroachDB logs on failure
        if: failure()
        run: docker logs dpm-cockroach
      - name: Stop CockroachDB
        if: always()
        run: docker rm -f dpm-cockroach >/dev/null 2>&1 || true

  crosscheck-matrix:
    # The full 7-tool countersigning matrix: every fixture verified by
    # migra, pgdiff, atlas, pg-schema-diff, liquibase, apgdiff, and flyway.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - name: Install the seven cross-checkers
        run: |
          set -euo pipefail
          pipx install migra
          # schemainspect needs pkg_resources (removed in setuptools 81); the pg driver is an extra
          pipx inject migra 'setuptools<81' psycopg2-binary
          go install github.com/joncrlsn/pgdiff@latest
          go install github.com/stripe/pg-schema-diff/cmd/pg-schema-diff@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          curl -sSf https://atlasgo.sh | sh
          sudo apt-get update -qq && sudo apt-get install -y -qq apgdiff postgresql-client
          LB=4.32.0
          curl -fsSL -o /tmp/lb.tar.gz "https://github.com/liquibase/liquibase/releases/download/v${LB}/liquibase-${LB}.tar.gz"
          sudo mkdir -p /opt/liquibase && sudo tar -xzf /tmp/lb.tar.gz -C /opt/liquibase
          echo "/opt/liquibase" >> "$GITHUB_PATH"
          FW=11.8.2
          curl -fsSL -o /tmp/fw.tar.gz "https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/${FW}/flyway-commandline-${FW}-linux-x64.tar.gz"
          sudo tar -xzf /tmp/fw.tar.gz -C /opt
          echo "/opt/flyway-${FW}" >> "$GITHUB_PATH"
      - name: Verify all seven are present
        run: |
          set -euo pipefail
          for t in migra pgdiff atlas pg-schema-diff liquibase apgdiff flyway; do
            command -v "$t" || { echo "MISSING: $t"; exit 1; }
          done
      - name: Run the cross-checker matrix
        env:
          DPM_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
        run: cargo test --locked --test convergence matrix_ -- --test-threads=4
