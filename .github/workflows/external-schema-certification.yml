name: external-schema-certification

on:
  pull_request:
    paths:
      - ".github/workflows/external-schema-certification.yml"
      - "scripts/certify-external-schema.sh"
      - "tests/fixtures/external-consumer-schema.sql"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - "scripts/certify-external-schema.sh"
      - "tests/fixtures/external-consumer-schema.sql"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-schema-certification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dpm_external
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dpm_external"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TARGET_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/dpm_external
      SHADOW_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Validate source and build the exact dpm binary
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo build --locked --release --bin dpm
      - name: Apply and verify an externally owned schema fixture
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/certify-external-schema.sh \
            --dpm target/release/dpm \
            --source-sql tests/fixtures/external-consumer-schema.sql \
            --target "$TARGET_DATABASE_URL" \
            --shadow "$SHADOW_DATABASE_URL" \
            --output-dir test-results/external-schema
      - name: Validate the bounded non-secret evidence contract
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("test-results/external-schema/external-schema-certification.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["version"] == 1
          assert report["evidenceClass"] == "external-schema-local-certification"
          assert report["decisionEligible"] is False
          assert report["applied"] is True
          assert report["verified"] is True
          assert report["sourceSqlBytes"] > 0
          for key in (
              "sourceSqlSha256",
              "dpmSha256",
              "applyLogSha256",
              "verifyLogSha256",
          ):
              assert len(report[key]) == 64
              int(report[key], 16)
          serialized = json.dumps(report)
          assert "postgres://" not in serialized
          assert "postgresql://" not in serialized
          assert "password" not in serialized.lower()
      - name: Upload non-secret external-schema evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: external-schema-certification-${{ github.run_id }}
          path: test-results/external-schema/
          if-no-files-found: error
          retention-days: 14
