name: peer authority parity certifier

on:
  pull_request:
    paths:
      - "scripts/certify-peer-authorities.sh"
      - "scripts/test-certify-peer-authorities.sh"
      - "docs/peer-authority-parity.md"
      - "docs/peer-authority-current-certification.json"
      - ".github/workflows/peer-authority-parity.yml"
  push:
    branches: [main]
    paths:
      - "scripts/certify-peer-authorities.sh"
      - "scripts/test-certify-peer-authorities.sh"
      - "docs/peer-authority-parity.md"
      - "docs/peer-authority-current-certification.json"
      - ".github/workflows/peer-authority-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peer-authority-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fail-closed-certifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate certifier shell syntax
        run: |
          bash -n scripts/certify-peer-authorities.sh
          bash -n scripts/test-certify-peer-authorities.sh
      - name: Prove continue, discrepancy, and missing-artifact decisions
        run: bash scripts/test-certify-peer-authorities.sh
      - name: Validate the current audit remains explicitly paused
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          report = json.loads(
              pathlib.Path("docs/peer-authority-current-certification.json")
              .read_text(encoding="utf-8")
          )
          assert report["format"] == "declmig.peer-authority-certification/v1"
          assert report["decision"] == "pause"
          assert report["decisionEligible"] is False
          assert report["policy"]["automaticWinner"] is False
          assert {item["kind"] for item in report["comparisons"]} == {
              "sql-catalog",
              "generated-types",
              "orm-projection",
          }
          assert all(item["status"] != "pass" for item in report["comparisons"])
          PY
