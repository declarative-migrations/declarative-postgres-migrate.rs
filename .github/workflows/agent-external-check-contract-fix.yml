name: agent-external-check-contract-fix

on:
  push:
    branches:
      - agent/harden-apply-convergence-20260804

permissions:
  contents: write

concurrency:
  group: agent-external-check-contract-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Restore external-check disagreement semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/verify.rs")
          text = path.read_text(encoding="utf-8")
          old_classification = "error: if output.status.success()"
          fixed_marker = "let agreed = output.status.success() && stdout.is_empty();"

          if old_classification not in text:
              if fixed_marker in text:
                  print("external-check disagreement semantics already fixed")
              else:
                  raise SystemExit(
                      "src/verify.rs: neither the old nor fixed external-check block was found"
                  )
          else:
              needle = 'name: "external".into(),'
              name_pos = text.index(needle)
              line_start = text.rfind("\n", 0, name_pos) + 1
              name_indent = text[line_start:name_pos]
              if not name_indent or name_indent.strip():
                  raise SystemExit("src/verify.rs: could not infer external report indentation")
              if not name_indent.endswith("    "):
                  raise SystemExit("src/verify.rs: external report is not four-space indented")

              block_indent = name_indent[:-4]
              start_marker = block_indent + "checks.push(CheckReport {"
              start = text.rfind(start_marker, 0, name_pos)
              if start < 0:
                  raise SystemExit("src/verify.rs: external CheckReport start not found")
              end_marker = "\n" + block_indent + "});\n"
              end = text.find(end_marker, name_pos)
              if end < 0:
                  raise SystemExit("src/verify.rs: external CheckReport end not found")
              end += len(end_marker)

              old = text[start:end]
              if old_classification not in old:
                  raise SystemExit(
                      "src/verify.rs: located external report lacks the old classification"
                  )

              lines = [
                  "let agreed = output.status.success() && stdout.is_empty();",
                  "let detail = if !stdout.is_empty() {",
                  "    stdout",
                  "} else if !stderr.is_empty() {",
                  "    stderr",
                  "} else if output.status.success() {",
                  "    String::new()",
                  "} else {",
                  '    format!("external check exited {}", output.status)',
                  "};",
                  "checks.push(CheckReport {",
                  '    name: "external".into(),',
                  "    command: reported_command,",
                  "    agreed,",
                  "    output: detail,",
                  "    // A checker that ran and returned non-zero is a semantic",
                  "    // disagreement. Only failure to spawn the checker is an",
                  "    // infrastructure error (handled by `with_context` above).",
                  "    error: None,",
                  "});",
              ]
              replacement = "\n".join(block_indent + line for line in lines) + "\n"
              path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

          rustfmt --edition 2021 src/verify.rs
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --lib
          DPM_TEST_DATABASE_URL=postgres://postgres@localhost:5432/postgres \
            cargo test --locked --test cli -- --test-threads=1
          cargo test --locked --test cockroach --no-run
          git diff --check
      - name: Commit and push source-only fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/verify.rs; then
            echo "No source change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/verify.rs
          git commit -m "Preserve external-check disagreement semantics"
          git push origin HEAD:agent/harden-apply-convergence-20260804
